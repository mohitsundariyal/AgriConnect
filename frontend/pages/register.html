<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriConnect - Sign Up</title>
    <link rel="stylesheet" href="../css/register.css">
</head>
<body>

    <div class="register-container">
        <div class="register-header">
            <h1>AgriConnect</h1>
            <p>Smart Farming for a Better Harvest</p>
        </div>

        <form id="registerForm">
            <h2>Create Account</h2>

            <div id="formMessage" class="message hidden"></div>

            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" required>
            </div>

            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter your phone number" required>
            </div>

            <div class="input-group">
                <label for="village">Village / Location</label>
                <input type="text" id="village" placeholder="Enter your village or town" required>
            </div>

            <button type="submit" id="submitBtn">Sign Up</button>
        </form>

        <div class="register-footer">
            <p>Already registered? <a href="login.html">Login</a></p>
        </div>
    </div>

    <script src="../js/register.js"></script>
</body>
</html>
