<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriConnect - Farm Expenses</title>
    <!-- Link to CSS file -->
    <link rel="stylesheet" href="../css/expenses.css">
</head>
<body>

    <div class="container">
        <!-- Navigation Link -->
        <div class="nav-back">
            <a href="dashboard.html">&larr; Back to Dashboard</a>
        </div>

        <h1>💰 Farm Expenses</h1>

        <!-- Message Box for Success / Errors -->
        <div id="messageBox" class="message hidden"></div>

        <!-- Farm Selection Section -->
        <div class="card">
            <div class="input-group">
                <label for="farmSelect">Select Farm</label>
                <select id="farmSelect">
                    <option value="">-- Choose a Farm First --</option>
                </select>
            </div>
        </div>

        <!-- Total Expense Highlight Box (Hidden until farm is selected) -->
        <div id="totalBox" class="total-box hidden">
            <h3>Total Expenses</h3>
            <p id="totalAmountText">₹0.00</p>
        </div>

        <!-- Add Expense Form Card (Hidden until a farm is selected) -->
        <div id="expenseFormCard" class="card form-card hidden">
            <h3>Add New Expense</h3>
            <form id="expenseForm">
                <div class="input-group">
                    <label for="category">Category *</label>
                    <select id="category" required>
                        <option value="Seeds">Seeds</option>
                        <option value="Fertilizer">Fertilizer</option>
                        <option value="Pesticide">Pesticide</option>
                        <option value="Labour">Labour</option>
                        <option value="Irrigation">Irrigation</option>
                        <option value="Equipment">Equipment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="e.g. Urea fertilizer 2 bags">
                </div>

                <div class="input-group">
                    <label for="amount">Amount (₹) *</label>
                    <input type="number" step="0.01" id="amount" placeholder="e.g. 1250" min="0.01" required>
                </div>

                <div class="input-group">
                    <label for="expenseDate">Expense Date *</label>
                    <input type="date" id="expenseDate" required>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary">Add Expense</button>
            </form>
        </div>

        <!-- Expenses Table Section -->
        <div id="tableSection" class="hidden">
            <h2>Expense Records</h2>
            <div class="table-responsive">
                <table class="expenses-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="expensesTableBody">
                        <!-- Rows loaded dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Link to JavaScript file -->
    <script src="../js/expenses.js"></script>
</body>
</html>
