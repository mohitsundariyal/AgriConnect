<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriConnect - Dashboard</title>
    <!-- CSS file link -->
    <link rel="stylesheet" href="../css/dashboard.css">
<base target="_blank">
</head>
<body>

    <!-- Top Navbar -->
    <header class="navbar">
        <div class="navbar-brand">
            <span class="logo-icon">🌾</span>
            <h1>AgriConnect</h1>
        </div>
        <button id="logoutBtn" class="logout-btn">Logout</button>
    </header>

    <!-- Main Container -->
    <main class="container">
        <!-- Welcome Message -->
        <section class="welcome-section">
            <h2 id="welcomeText">Welcome, Farmer</h2>
            <p>Manage your smart farming activities below.</p>
        </section>

        <!-- Clickable Cards Grid -->
        <div class="cards-grid">
            <div class="card card-farms" onclick="location.href='farms.html'">
                <div class="card-icon">🌱</div>
                <div class="card-content">
                    <h3>My Farms</h3>
                    <p>View and manage your agricultural lands.</p>
                </div>
                <span class="card-arrow">→</span>
            </div>

            <div class="card card-crops" onclick="location.href='crops.html'">
                <div class="card-icon">🌾</div>
                <div class="card-content">
                    <h3>My Crops</h3>
                    <p>Check crop status, health, and updates.</p>
                </div>
                <span class="card-arrow">→</span>
            </div>

            <div class="card card-expenses" onclick="location.href='expenses.html'">
                <div class="card-icon">💰</div>
                <div class="card-content">
                    <h3>Expenses</h3>
                    <p>Track your farming costs and budgets.</p>
                </div>
                <span class="card-arrow">→</span>
            </div>
        </div>
    </main>

    <!-- JS file link -->
    <script src="../js/dashboard.js"></script>
</body>
</html>
